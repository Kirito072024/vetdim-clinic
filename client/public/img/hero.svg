    <ellipse cx="128" cy="215" rx="34" ry="62" transform="rotate(20 128 215)" fill="#A86B3C"/>
    <ellipse cx="282" cy="215" rx="34" ry="62" transform="rotate(-20 282 215)" fill="#A86B3C"/>
    <!-- head -->
    <ellipse cx="205" cy="220" rx="82" ry="88" fill="#E0A96D"/>
    <!-- patch -->
    <ellipse cx="238" cy="196" rx="28" ry="24" fill="#C98A4E"/>
    <!-- muzzle -->
    <ellipse cx="205" cy="262" rx="48" ry="38" fill="#F6DDBE"/>
    <!-- eyes -->
    <circle cx="176" cy="204" r="9" fill="#1F1A17"/><circle cx="179" cy="201" r="3" fill="#fff"/>
    <circle cx="234" cy="204" r="9" fill="#1F1A17"/><circle cx="237" cy="201" r="3" fill="#fff"/>
