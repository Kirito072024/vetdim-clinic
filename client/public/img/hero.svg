  <circle cx="480" cy="80" r="26" fill="#FFD0BF"/>
  <circle cx="70" cy="110" r="14" fill="#FFD0BF"/>
  <!-- floating paws -->
  <g fill="#0F766E" opacity=".18">
    <g transform="translate(60 360) rotate(-20)"><ellipse cx="0" cy="10" rx="5" ry="6"/><ellipse cx="9" cy="0" rx="5" ry="6"/><ellipse cx="20" cy="0" rx="5" ry="6"/><ellipse cx="29" cy="10" rx="5" ry="6"/><path d="M14 12c-7 0-14 9-14 14 0 4 3 6 7 6 3 0 4-2 7-2s4 2 7 2c4 0 7-2 7-6 0-5-7-14-14-14Z"/></g>
    <g transform="translate(470 220) rotate(15)"><ellipse cx="0" cy="10" rx="5" ry="6"/><ellipse cx="9" cy="0" rx="5" ry="6"/><ellipse cx="20" cy="0" rx="5" ry="6"/><ellipse cx="29" cy="10" rx="5" ry="6"/><path d="M14 12c-7 0-14 9-14 14 0 4 3 6 7 6 3 0 4-2 7-2s4 2 7 2c4 0 7-2 7-6 0-5-7-14-14-14Z"/></g>
  </g>
  <!-- heart -->
  <path d="M282 92c-6-14-28-12-28 4 0 14 28 28 28 28s28-14 28-28c0-16-22-18-28-4Z" fill="#F97352"/>

