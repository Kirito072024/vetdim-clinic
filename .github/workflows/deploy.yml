# Автодеплой: кожен push у main → тести API → збірка React → публікація на GitHub Pages
name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: Build client
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Сайт відкривається за адресою https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Адреса API на Render (Settings → Secrets and variables → Actions → Variables → API_URL).
          # Якщо змінна порожня — сайт працює в демо-режимі без сервера.
          VITE_API_URL: ${{ vars.API_URL }}
      # GitHub Pages не знає про маршрути React: 404.html = index.html, тоді /doctors/1 відкривається напряму
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
