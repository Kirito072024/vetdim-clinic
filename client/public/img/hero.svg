    <ellipse cx="390" cy="290" rx="36" ry="24" fill="#E2E8F0"/>
    <!-- eyes -->
    <ellipse cx="362" cy="258" rx="11" ry="13" fill="#4ADE80"/><ellipse cx="362" cy="258" rx="4" ry="11" fill="#1F1A17"/>
    <ellipse cx="418" cy="258" rx="11" ry="13" fill="#4ADE80"/><ellipse cx="418" cy="258" rx="4" ry="11" fill="#1F1A17"/>
