    <path d="M454 236l-6-70-50 44Z" fill="#94A3B8"/>
    <path d="M336 222l4-38 26 24Z" fill="#FBCFE8"/>
    <path d="M444 222l-4-38-26 24Z" fill="#FBCFE8"/>
