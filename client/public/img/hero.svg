    <path d="M500 450c40-20 40-90 0-110" stroke="#94A3B8" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <path d="M300 470c-4-70 20-120 90-120s96 50 92 120Z" fill="#94A3B8"/>
    <path d="M360 470c0-44 12-74 30-74s30 30 30 74Z" fill="#E2E8F0"/>
